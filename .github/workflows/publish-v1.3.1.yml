name: Publish LazerASIO v1.3.1
on:
  push:
    branches: [release-publish/v1.3.1]
    paths: [.github/workflows/publish-v1.3.1.yml]
concurrency: publish-lazerasio-v1.3.1
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'comgrat/Lazer-Hitsound-ASIO'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c603b0bbfb9b16b157bf89acc46c45fcc1e323cf
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and verify the portable package
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne 'c603b0bbfb9b16b157bf89acc46c45fcc1e323cf') { throw 'Release source mismatch' }
          .\Build.ps1 -SkipTests
          .\distribution\Build-Share.ps1 -OutputDirectory .\artifacts\LazerASIO-v1.3.1 -PackageVersion 1.3.1
          .\tools\qa\Test-SharePackage.ps1 -PackageDirectory .\artifacts\LazerASIO-v1.3.1
          if ($LASTEXITCODE) { throw 'Portable package regression failed.' }
          $zip = Get-Item -LiteralPath '.\artifacts\LazerASIO-v1.3.1.zip'
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  ' + $zip.Name) | Set-Content -Encoding ASCII -LiteralPath ($zip.FullName + '.sha256')
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            artifacts/LazerASIO-v1.3.1.zip
            artifacts/LazerASIO-v1.3.1.zip.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Publish the tagged source and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check LazerASIO-v1.3.1.zip.sha256
          cat <<'RELEASE_NOTES' > release-notes.md
          ## 修复
          
          - 修复 osu!taiko 进谱面后开头鼓点无声或漏音的问题。新取出的鼓点样本会在创建播放通道前绑定到 GameplayMixer。
          - 首次播放的单次音效按队列顺序等样本加载，防止已提交加载的音效漏掉首击。后端会丢弃排队达到 50 毫秒的单次击打，避免恢复时补播旧鼓点。
          
          维护者在真实 osu!lazer 客户端及 ASIO 设备上确认测试版已解决报告的问题。软件检查另行验证了首击的混音器绑定、样本增益和过期击打处理。
          
          下载 **LazerASIO-v1.3.1.zip**，完整解压到新文件夹，退出旧工具并重启游戏。运行新版的 LazerASIO.exe。请使用同一版本内的后端、Hook 和托管桥。
          
          ## English
          
          - Fixed missing osu!taiko hitsounds at the start of a beatmap by binding pooled drum samples to GameplayMixer before creating playback channels.
          - The first one-shot can queue behind its sample load. One-shots that spend at least 50 ms in the backend queue are discarded to avoid playing overdue hits.
          
          The maintainer confirmed the reported problem was fixed with the test build on real ASIO hardware. Download the Windows x64 portable ZIP, extract it into a fresh folder, close the old tool, and restart the game before attaching with LazerASIO.exe.
          RELEASE_NOTES
          gh release create v1.3.1 LazerASIO-v1.3.1.zip LazerASIO-v1.3.1.zip.sha256 \
            --repo comgrat/Lazer-Hitsound-ASIO --target c603b0bbfb9b16b157bf89acc46c45fcc1e323cf --latest \
            --title 'LazerASIO v1.3.1' --notes-file release-notes.md
